<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Mali Müşavir Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EF;--bg2:#EFEBE3;--white:#FFFFFF;
  --ink:#18160F;--ink2:#4B4740;--ink3:#9B9589;
  --green:#1C5C34;--green2:#2A7A48;--green3:#E8F3EC;
  --red:#B5261E;--red2:#FDECEA;
  --amber:#C46A00;--amber2:#FFF4E5;
  --blue:#1A52A8;--blue2:#EBF1FB;
  --wa:#25D366;--wa2:#E8FBF0;--wa-dark:#128C7E;
  --border:#DDD8CE;
  --radius:12px;
  --shadow:0 1px 3px rgba(24,22,15,.07),0 6px 20px rgba(24,22,15,.06);
  --shadow2:0 2px 8px rgba(24,22,15,.10),0 20px 60px rgba(24,22,15,.15);
  --serif:'Lora',Georgia,serif;--sans:'Plus Jakarta Sans',sans-serif;
  --sidebar:240px;
}
html,body{height:100%;margin:0;padding:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;overflow:hidden}
button,input,select,textarea{font-family:var(--sans)}
button{cursor:pointer;border:none;outline:none}
input,select,textarea{outline:none}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);position:relative;overflow:hidden}
.login-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(28,92,52,.4) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(28,92,52,.2) 0%,transparent 50%)}
.login-card{background:#fff;border-radius:16px;padding:44px 40px;width:100%;max-width:400px;box-shadow:var(--shadow2);position:relative;z-index:1;animation:modal-in .3s ease}
.login-logo{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--ink);margin-bottom:4px}
.login-sub{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:1px;margin-bottom:32px}
#root{display:flex;flex-direction:column;height:100vh}
.app-shell{display:flex;flex:1;height:100vh;overflow:hidden;width:100%}
.sidebar{width:var(--sidebar);background:var(--ink);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;height:100vh}
.sidebar-header{padding:28px 20px 22px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo{font-family:var(--serif);font-size:19px;color:#fff;font-weight:500;line-height:1.3;margin-bottom:3px}
.sidebar-sub{font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1px}
.sidebar-nav{padding:14px 10px;flex:1}
.nav-section{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,.25);padding:14px 12px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:rgba(255,255,255,.55);font-size:13px;font-weight:400;cursor:pointer;transition:all .15s;margin-bottom:2px;width:100%;text-align:left;background:none;border:none}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff;font-weight:500}
.nav-item svg{flex-shrink:0;opacity:.65}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08)}
.user-info{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.user-dot{width:7px;height:7px;border-radius:50%;background:#6EE7A0;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0;min-height:0}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-title{font-family:var(--serif);font-size:20px;font-weight:500;color:var(--ink)}
.topbar-right{display:flex;align-items:center;gap:10px}
.content{flex:1;overflow-y:auto;padding:28px;height:0}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-family:var(--serif);font-size:16px;font-weight:500}
.card-body{padding:22px}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--green)}
.stat.warn::before{background:var(--amber)}
.stat.danger::before{background:var(--red)}
.stat.wa::before{background:var(--wa)}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);font-weight:600;margin-bottom:10px}
.stat-value{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1;margin-bottom:4px}
.stat.warn .stat-value{color:var(--amber)}
.stat.danger .stat-value{color:var(--red)}
.stat.wa .stat-value{color:var(--wa-dark)}
.stat-sub{font-size:12px;color:var(--ink3)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);font-weight:600;padding:10px 16px;border-bottom:2px solid var(--border);background:var(--bg)}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.badge-green{background:var(--green3);color:var(--green)}
.badge-red{background:var(--red2);color:var(--red)}
.badge-amber{background:var(--amber2);color:var(--amber)}
.badge-blue{background:var(--blue2);color:var(--blue)}
.badge-gray{background:var(--bg2);color:var(--ink2)}
.badge-wa{background:var(--wa2);color:var(--wa-dark)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;border:none;cursor:pointer}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green2)}
.btn-ghost{background:transparent;color:var(--ink2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg2)}
.btn-danger{background:var(--red2);color:var(--red)}.btn-danger:hover{background:#fbd0cc}
.btn-wa{background:var(--wa);color:#fff}.btn-wa:hover{background:var(--wa-dark)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.form-control{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--ink);background:var(--white);transition:border-color .15s}
.form-control:focus{border-color:var(--green)}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:90px}
.form-row{display:grid;gap:14px}.form-row.c2{grid-template-columns:1fr 1fr}.form-row.c3{grid-template-columns:1fr 1fr 1fr}
.checkbox-label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--ink2)}
.overlay{position:fixed;inset:0;background:rgba(24,22,15,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:540px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow2);animation:modal-in .2s ease}
.modal-lg{max-width:680px}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-family:var(--serif);font-size:17px;font-weight:500}
.modal-body{padding:22px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0}
.btn-close{background:none;border:none;font-size:22px;color:var(--ink3);cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}.btn-close:hover{background:var(--bg2)}
@keyframes modal-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.wa-preview-bubble{background:#E7FFDB;border:1px solid #C8F5C0;border-radius:12px 12px 4px 12px;padding:13px 16px;font-size:13.5px;line-height:1.65;color:#1a1a1a;white-space:pre-wrap;word-break:break-word;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wa-preview-bubble::after{content:'✓✓';position:absolute;bottom:6px;right:10px;font-size:10px;color:#53bdeb}
.wa-preview-wrap{background:#E5DDD5;border-radius:12px;padding:16px}
.wa-phone-label{font-size:11px;color:var(--ink3);text-align:center;margin-bottom:8px;font-weight:500}
.wa-open-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:var(--wa);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px;transition:background .15s}
.wa-open-btn:hover{background:var(--wa-dark)}
.wa-hint{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:8px}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px}
.alert-error{background:var(--red2);color:var(--red)}
.alert-success{background:var(--green3);color:var(--green)}
.alert-info{background:var(--blue2);color:var(--blue)}
.alert-wa{background:var(--wa2);color:var(--wa-dark)}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spinner-dark{border-color:rgba(24,22,15,.15);border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 20px;color:var(--ink3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.text-muted{color:var(--ink3)}
.fw-600{font-weight:600}
.loading-page{display:flex;align-items:center;justify-content:center;height:100vh;gap:12px;font-size:15px;color:var(--ink3)}
.char-count{font-size:11px;color:var(--ink3);margin-top:4px;text-align:right}
.fc .fc-toolbar-title{font-family:var(--serif);font-size:18px!important}
.fc .fc-button-primary{background:var(--green)!important;border-color:var(--green)!important}
.fc .fc-button-primary:hover{background:var(--green2)!important}
.fc .fc-daygrid-event{border-radius:4px!important;font-size:11px!important;padding:1px 5px!important}
.fc .fc-day-today{background:rgba(28,92,52,.05)!important}
.cal-add-hint{font-size:12px;color:var(--ink3);margin-top:12px;text-align:center}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow2);z-index:9999;animation:toast-in .25s ease;display:flex;align-items:center;gap:10px;max-width:340px}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.wa{background:var(--wa-dark)}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.type-kdv{background:#EDE9FE;color:#5B21B6}
.type-stopaj{background:#FEF3C7;color:#92400E}
.type-muhasebe{background:#DBEAFE;color:#1E40AF}
.type-gelir{background:#FCE7F3;color:#9D174D}
.type-gecici{background:#D1FAE5;color:#065F46}
.type-sgk{background:#FEE2E2;color:#991B1B}
.type-kisisel{background:#F3F4F6;color:#374151}
.type-damga{background:#FDF2F8;color:#9D174D}
.type-oiv{background:#EEF2FF;color:#3730A3}
.type-otv{background:#FFF7ED;color:#C2410C}
.type-mtv{background:#F0FDF4;color:#166534}
/* ── Takvim filtre barı ── */
.cal-filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:12px 16px;background:var(--white);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.cal-filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);flex-shrink:0}
.cal-filter-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--white);color:var(--ink3);cursor:pointer;transition:all .15s;user-select:none}
.cal-filter-chip:hover{border-color:var(--ink3);color:var(--ink2)}
.cal-filter-chip.on{color:var(--ink)}
.cal-filter-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .15s}
/* ── Luca export buton ── */
.btn-luca{background:#1C5C34;color:#fff}.btn-luca:hover{background:#14472A}
.btn-excel{background:#217346;color:#fff}.btn-excel:hover{background:#1a5c38}
/* ── Sticky table headers ── */
.sticky-thead th{position:sticky;top:0;z-index:2;background:var(--bg);box-shadow:0 1px 0 var(--border)}
/* ── WhatsApp gönderildi — satır pasifleştirme ── */
.wa-sent-row{opacity:.45;transition:opacity .3s}
.wa-sent-row td{color:var(--ink3)!important}
.wa-sent-check{color:var(--wa-dark);font-size:11px;font-weight:700;margin-left:4px}
/* ── Filtre chip butonları ── */
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--white);color:var(--ink2);cursor:pointer;transition:all .15s;white-space:nowrap}
.chip:hover{border-color:var(--ink3)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
/* ── Chart container ── */
.chart-container{position:relative;height:220px}
/* ── Evrak expiry renkleri ── */
.expiry-warn{background:var(--amber2);color:var(--amber)}
.expiry-ok{background:var(--green3);color:var(--green)}
.expiry-none{background:var(--bg2);color:var(--ink3)}
/* ── Tabs ── */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:18px}
.tab-btn{padding:10px 20px;font-size:13px;font-weight:500;color:var(--ink3);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}
.tab-btn:hover:not(.active){color:var(--ink2)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const API_BASE='';

async function api(path,opts={}){
  const res=await fetch(`${API_BASE}/api${path}`,{
    credentials:'include',
    headers:{'Content-Type':'application/json',...(opts.headers||{})},
    ...opts,
    body:opts.body?JSON.stringify(opts.body):undefined,
  });
  if(res.status===401&&path!=='/auth/login'){window.__handleUnauth?.();throw new Error('Oturum sona erdi');}
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||`Hata ${res.status}`);}
  return res.json();
}

const PT_MAP={
  kdv:{label:'KDV',cls:'type-kdv'},

  damga_vergisi:{label:'Damga Vergisi',cls:'type-damga'},
  ozel_iletisim_vergisi:{label:'Özel İletişim',cls:'type-oiv'},
  otv:{label:'ÖTV',cls:'type-otv'},
  motorlu_tasit_vergisi:{label:'MTV',cls:'type-mtv'},
};
const TypeBadge=({type})=>{const m=PT_MAP[type]||{label:type,cls:'type-kisisel'};return <span className={`badge ${m.cls}`}>{m.label}</span>;};

function Ico({n,s=14}){
  const icons={
    dashboard:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>,
    clients:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>,

function Toast({msg,type,onClose}){
  useEffect(()=>{if(msg){const t=setTimeout(onClose,3500);return()=>clearTimeout(t);}},[msg]);
  if(!msg)return null;
  return <div className={`toast ${type}`}><span style={{flex:1}}>{msg}</span><button onClick={onClose} style={{background:'none',border:'none',color:'inherit',cursor:'pointer',fontSize:18}}>×</button></div>;
}

function LoginPage({onLogin}){
  const [form,setForm]=useState({username:'',password:''});
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const submit=async()=>{
    setErr('');setLoading(true);
    try{const r=await api('/auth/login',{method:'POST',body:form});onLogin(r.username);}
    catch(e){setErr(e.message);}finally{setLoading(false);}
  };
  return(
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">Mali Müşavir</div>
        <div className="login-sub">Asistan Paneli</div>
        {err&&<div className="alert alert-error">{err}</div>}
        <div className="form-group"><label className="form-label">Kullanıcı Adı</label><input className="form-control" value={form.username} onChange={e=>set('username',e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()} autoFocus/></div>
        <div className="form-group"><label className="form-label">Şifre</label><input className="form-control" type="password" value={form.password} onChange={e=>set('password',e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}/></div>
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:4}} onClick={submit} disabled={loading}>{loading?<span className="spinner"/>:'Giriş Yap'}</button>
      </div>
    </div>
  );
}

function Clients({onSendWa,toastFn}){
  const [clients,setClients]=useState([]);
  const [modal,setModal]=useState(null);
  const [detailClient,setDetailClient]=useState(null);
  const [search,setSearch]=useState('');
  const [waSentIds,setWaSentIds]=useState(new Set());
  const load=()=>api('/clients').then(setClients).catch(console.error);
  useEffect(()=>{load();},[]);
  const del=async(c)=>{if(!confirm(`"${c.full_name}" pasife alınacak. Devam?`))return;await api(`/clients/${c.id}`,{method:'DELETE'});toastFn('Pasife alındı.');load();};
  const save=async(form)=>{
    if(form.id)await api(`/clients/${form.id}`,{method:'PUT',body:form});
    else await api('/clients',{method:'POST',body:form});
    toastFn('Kaydedildi.');setModal(null);load();
  };
  const carryBalance=async(c)=>{
    if(!confirm(`"${c.full_name}" için ${parseFloat(c.monthly_fee).toLocaleString('tr-TR',{minimumFractionDigits:2})} ₺ muhasebe ücreti ödenmedi olarak işaretlenecek ve bakiyeye eklenecek. Devam?`))return;
    try{
      const r=await api(`/clients/${c.id}/carry-balance`,{method:'POST'});
      toastFn(`Bakiyeye eklendi. Toplam: ${parseFloat(r.balance).toLocaleString('tr-TR',{minimumFractionDigits:2})} ₺`,'wa');
      load();
    }catch(e){toastFn(e.message,'error');}
  };
  const clearBalance=async(c)=>{
    if(!confirm(`"${c.full_name}" için ${parseFloat(c.balance).toLocaleString('tr-TR',{minimumFractionDigits:2})} ₺ bakiye sıfırlanacak. Ödeme alındı mı?`))return;
    await api(`/clients/${c.id}/clear-balance`,{method:'POST'});
    toastFn('Bakiye sıfırlandı ✓');load();
  };
  const handleWa=(c)=>{
    onSendWa(c);
    setWaSentIds(prev=>new Set([...prev,c.id]));
  };
  const filtered=clients.filter(c=>c.full_name.toLowerCase().includes(search.toLowerCase())||c.phone.includes(search)||(c.tax_number||'').includes(search));
  return(
    <>
      <div className="card">
        <div className="card-header">
          <span className="card-title">Müşteriler</span>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <input className="form-control" style={{width:220}} placeholder="İsim, telefon, vergi no..." value={search} onChange={e=>setSearch(e.target.value)}/>
            <button className="btn btn-primary btn-sm" onClick={()=>setModal({})}><Ico n="plus" s={13}/> Yeni Müşteri</button>
          </div>
        </div>
        <div className="table-wrap" style={{maxHeight:500,overflowY:'auto'}}><table>
          <thead className="sticky-thead"><tr><th>Ad Soyad</th><th>Telefon</th><th>Vergi No</th><th>Aylık Ücret</th><th>Bakiye</th><th>Durum</th><th></th></tr></thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={7}><div className="empty"><div className="empty-icon">👤</div><p>Müşteri bulunamadı</p></div></td></tr>}
            {filtered.map(c=>{
              const waAlreadySent=waSentIds.has(c.id);
              return(
                <tr key={c.id} className={waAlreadySent?'wa-sent-row':''}>
                  <td>
                    <button className="fw-600" style={{background:'none',border:'none',cursor:'pointer',color:'var(--blue)',textDecoration:'underline',fontSize:13,padding:0}} onClick={()=>setDetailClient(c)}>{c.full_name}</button>
                    {waAlreadySent&&<span className="wa-sent-check">✓ WA gönderildi</span>}
                  </td>
                  <td style={{fontFamily:'monospace',fontSize:12}}>{c.phone}</td>
                  <td style={{fontSize:12,color:'var(--ink3)'}}>{c.tax_number||'—'}</td>
                  <td>{c.monthly_fee?parseFloat(c.monthly_fee).toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺':'—'}</td>
                  <td>{parseFloat(c.balance||0)>0?<span className="badge badge-red">+{parseFloat(c.balance).toLocaleString('tr-TR',{minimumFractionDigits:2})} ₺</span>:<span className="text-muted">—</span>}</td>
                  <td>{c.is_active?<span className="badge badge-green">Aktif</span>:<span className="badge badge-gray">Pasif</span>}</td>
                  <td><div style={{display:'flex',gap:6}}>
                    <button className="btn btn-wa btn-sm" onClick={()=>handleWa(c)} title="WhatsApp Gönder" style={waAlreadySent?{opacity:.5}:{}}><span style={{display:'inline-flex',alignItems:'center',gap:5}}>{WA_SVG} WA</span></button>
                    <button className="btn btn-ghost btn-sm" onClick={()=>setModal(c)}><Ico n="edit" s={12}/></button>
                    {c.monthly_fee&&c.is_active&&<button className="btn btn-danger btn-sm" style={{background:'var(--amber2)',color:'var(--amber)',borderColor:'var(--amber)'}} onClick={()=>carryBalance(c)} title="Ödeme yapılmadı — sonraki aya devret">Devret</button>}
                    {parseFloat(c.balance||0)>0&&<button className="btn btn-ghost btn-sm" style={{color:'var(--green)'}} onClick={()=>clearBalance(c)} title="Bakiyeyi sıfırla (ödedi)">Ödedi ✓</button>}
                    {c.is_active&&<button className="btn btn-danger btn-sm" onClick={()=>del(c)}><Ico n="trash" s={12}/></button>}
                  </div></td>
                </tr>
              );
            })}
          </tbody>
        </table></div>
      </div>
      {modal!==null&&<ClientModal data={modal} onSave={save} onClose={()=>setModal(null)}/>}
      {detailClient&&<ClientDetailModal client={detailClient} onClose={()=>{setDetailClient(null);load();}} toastFn={toastFn}/>}
    </>
  );
}

function ClientDetailModal({client,onClose,toastFn}){
  const [tab,setTab]=useState('transactions');
  const [transactions,setTransactions]=useState([]);
  const [documents,setDocuments]=useState([]);
  const [txForm,setTxForm]=useState({tx_type:'debit',amount:'',description:'',tx_date:new Date().toISOString().split('T')[0]});
  const [docForm,setDocForm]=useState({doc_name:'',file_path:'',expiry_date:'',notes:''});
  const [loading,setLoading]=useState(false);

  const loadTx=()=>api(`/clients/${client.id}/transactions`).then(setTransactions).catch(console.error);
  const loadDocs=()=>api(`/clients/${client.id}/documents`).then(setDocuments).catch(console.error);
  useEffect(()=>{loadTx();loadDocs();},[]);

  const addTx=async()=>{
    if(!txForm.amount){toastFn('Tutar girin.','error');return;}
    setLoading(true);
    try{await api(`/clients/${client.id}/transactions`,{method:'POST',body:txForm});toastFn('Hareket eklendi.');setTxForm(f=>({...f,amount:'',description:''}));loadTx();}
    catch(e){toastFn(e.message,'error');}finally{setLoading(false);}

    if(!docForm.doc_name){toastFn('Evrak adı girin.','error');return;}
    setLoading(true);
    try{await api(`/clients/${client.id}/documents`,{method:'POST',body:docForm});toastFn('Evrak eklendi.');setDocForm({doc_name:'',file_path:'',expiry_date:'',notes:''});loadDocs();}

function Payments({onSendWa,toastFn}){
  const [payments,setPayments]=useState([]);
  const [modal,setModal]=useState(null);
  const [filter,setFilter]=useState('pending');
  const [typeFilter,setTypeFilter]=useState('');
  const [waSentIds,setWaSentIds]=useState(new Set());
  const [selIds,setSelIds]=useState(new Set());
  const [bulkLoading,setBulkLoading]=useState(false);
  const [bulkResult,setBulkResult]=useState(null);
  const nowY=new Date().getFullYear(),nowM=new Date().getMonth()+1;
  const [monthFilter,setMonthFilter]=useState(`${nowY}-${String(nowM).padStart(2,'0')}`);
  const monthOptions=(()=>{const opts=[];for(let i=-3;i<=6;i++){const d=new Date(nowY,nowM-1+i,1);const y=d.getFullYear(),m=d.getMonth()+1;opts.push({value:`${y}-${String(m).padStart(2,'0')}`,label:d.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})});}return opts;})();
  const load=()=>{
    const qs=new URLSearchParams();
    if(filter)qs.set('status',filter);
    if(typeFilter)qs.set('payment_type',typeFilter);
    if(monthFilter){const[y,m]=monthFilter.split('-');const last=new Date(y,m,0).getDate();qs.set('date_from',`${monthFilter}-01`);qs.set('date_to',`${monthFilter}-${last}`);}
    api(`/payments?${qs.toString()}`).then(ps=>{setPayments(ps);setSelIds(new Set());}).catch(console.error);
  };
  useEffect(()=>{load();},[filter,typeFilter,monthFilter]);
  const toggleSel=(id)=>setSelIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const toggleAll=()=>setSelIds(prev=>prev.size===payments.filter(p=>p.client_id&&p.status!=='paid').length?new Set():new Set(payments.filter(p=>p.client_id&&p.status!=='paid').map(p=>p.id)));
  const sendable=payments.filter(p=>p.client_id&&p.status!=='paid');
  const bulkSend=async()=>{
    if(!selIds.size){return;}
    setBulkLoading(true);setBulkResult(null);
    try{
      const r=await api('/whatsapp/bulk-send',{method:'POST',body:{payment_ids:[...selIds]}});
      setBulkResult(r);
      if(r.ok>0)setWaSentIds(prev=>{const n=new Set(prev);[...selIds].forEach(id=>n.add(id));return n;});
    }catch(e){setBulkResult({error:e.message});}
    finally{setBulkLoading(false);}
  };
  const markPaid=async(id)=>{await api(`/payments/${id}/mark-paid`,{method:'POST'});toastFn('Ödeme tamamlandı ✓');load();};
  const del=async(id)=>{if(!confirm('Ödemeyi sil?'))return;await api(`/payments/${id}`,{method:'DELETE'});toastFn('Silindi.');load();};
  const save=async(form)=>{
    if(form.id)await api(`/payments/${form.id}`,{method:'PUT',body:form});
    else await api('/payments',{method:'POST',body:form});
    toastFn('Kaydedildi.');setModal(null);load();
  };
  const handleWa=(client,payment)=>{
    onSendWa(client,payment);
    setWaSentIds(prev=>new Set([...prev,payment.id]));
  };
  const exportLuca=()=>{
    const qs=new URLSearchParams();
    if(filter)qs.set('status',filter);
    if(typeFilter)qs.set('payment_type',typeFilter);
    if(monthFilter){const[y,m]=monthFilter.split('-');const last=new Date(y,m,0).getDate();qs.set('date_from',`${monthFilter}-01`);qs.set('date_to',`${monthFilter}-${last}`);}
    window.open(`/api/luca/export?${qs.toString()}`,'_blank');
    toastFn('📊 Luca Excel dosyası indiriliyor...');
  };
  const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('tr-TR');
  const fmtAmt=a=>a?parseFloat(a).toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺':'—';
  const today=new Date().toISOString().split('T')[0];

  const TYPE_CHIPS=[
    {key:'',label:'Tümü'},
    {key:'kdv',label:'KDV'},
    {key:'muhasebe_ucreti',label:'Muhasebe'},
    {key:'sgk',label:'SGK'},
    {key:'stopaj',label:'Stopaj'},
    {key:'gelir_vergisi',label:'Gelir V.'},
    {key:'gecici_vergi',label:'Geçici V.'},
    {key:'damga_vergisi',label:'Damga'},
    {key:'motorlu_tasit_vergisi',label:'MTV'},
    {key:'otv',label:'ÖTV'},
  ];

  return(
    <>
      <div className="card">
        <div className="card-header">
          <span className="card-title">Ödemeler</span>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <select className="form-control" style={{width:155}} value={monthFilter} onChange={e=>setMonthFilter(e.target.value)}>
              {monthOptions.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
            </select>
            <select className="form-control" style={{width:125}} value={filter} onChange={e=>setFilter(e.target.value)}>
              <option value="">Tüm Durumlar</option><option value="pending">Bekleyen</option>
              <option value="paid">Ödendi</option><option value="overdue">Gecikmiş</option>
            </select>
            {selIds.size>0&&(
              <button className="btn btn-wa btn-sm" onClick={bulkSend} disabled={bulkLoading}>
                {bulkLoading?<span className="spinner"/>:WA_SVG} Toplu Gönder ({selIds.size})
              </button>
            )}
            <button className="btn btn-excel btn-sm" onClick={exportLuca} title="Luca Excel Fiş Aktarımı">
              📊 Luca'ya Aktar
            </button>
            <button className="btn btn-primary btn-sm" onClick={()=>setModal({})}><Ico n="plus" s={13}/> Yeni Ödeme</button>
          </div>
        </div>
        {bulkResult&&(
          <div className={`alert ${bulkResult.error?'alert-error':'alert-info'}`} style={{margin:'8px 16px',fontSize:13}}>
            {bulkResult.error?bulkResult.error:`Gönderildi: ${bulkResult.ok} ✓  |  Hata: ${bulkResult.error_count||0}  |  Atlandı: ${bulkResult.skip||0}`}
            <button style={{float:'right',background:'none',border:'none',cursor:'pointer',fontWeight:700}} onClick={()=>setBulkResult(null)}>×</button>
          </div>
        )}
        <div style={{padding:'10px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg)'}}>
          <div className="filter-chips">
            {TYPE_CHIPS.map(c=>(
              <button key={c.key} className={`chip ${typeFilter===c.key?'active':''}`} onClick={()=>setTypeFilter(c.key)}>{c.label}</button>
            ))}
            {sendable.length>0&&(
              <button className={`chip ${selIds.size===sendable.length?'active':''}`} style={{marginLeft:'auto',fontSize:11}} onClick={toggleAll}>
                {selIds.size===sendable.length?'☑ Seçimi Kaldır':'☐ Tümünü Seç'}
              </button>
            )}
          </div>
        </div>
        <div className="table-wrap" style={{maxHeight:520,overflowY:'auto'}}><table>
          <thead className="sticky-thead"><tr><th style={{width:32}}></th><th>Son Tarih</th><th>Müşteri</th><th>Başlık</th><th>Tür</th><th>Tutar</th><th>Durum</th><th></th></tr></thead>
          <tbody>
            {payments.length===0&&<tr><td colSpan={7}><div className="empty"><div className="empty-icon">💳</div><p>Ödeme bulunamadı</p></div></td></tr>}
            {payments.map(p=>{
              const overdue=p.status==='pending'&&p.due_date<today;
              const waAlreadySent=waSentIds.has(p.id);
              return(
                <tr key={p.id} className={waAlreadySent?'wa-sent-row':''}>
                  <td>{p.client_id&&p.status!=='paid'&&<input type="checkbox" checked={selIds.has(p.id)} onChange={()=>toggleSel(p.id)} style={{cursor:'pointer'}}/>}</td>
                  <td><span className={`badge ${overdue?'badge-red':p.status==='paid'?'badge-green':'badge-amber'}`}>{fmtDate(p.due_date)}</span></td>
                  <td className="fw-600">{p.client_name||<span className="text-muted">Kişisel</span>}</td>
                  <td>{p.title}{waAlreadySent&&<span className="wa-sent-check">✓ WA</span>}</td>
                  <td><TypeBadge type={p.payment_type}/></td>
                  <td className="fw-600">{fmtAmt(p.amount)}</td>
                  <td>{p.status==='paid'?<span className="badge badge-green">✓ Ödendi</span>:overdue?<span className="badge badge-red">Gecikmiş</span>:<span className="badge badge-amber">Bekliyor</span>}</td>
                  <td><div style={{display:'flex',gap:5}}>
                    {p.status!=='paid'&&p.client_id&&<button className="btn btn-wa btn-sm" onClick={()=>handleWa({id:p.client_id,full_name:p.client_name,phone:p.client_phone},p)} title="WhatsApp" style={waAlreadySent?{opacity:.5}:{}}>{WA_SVG}{waAlreadySent&&' ✓'}</button>}
                    {p.status!=='paid'&&<button className="btn btn-ghost btn-sm" onClick={()=>markPaid(p.id)} title="Ödendi"><Ico n="check" s={12}/></button>}
                    <button className="btn btn-danger btn-sm" onClick={()=>del(p.id)}><Ico n="trash" s={12}/></button>
                  </div></td>
                </tr>
              );
            })}
          </tbody>
        </table></div>
      </div>
      {modal!==null&&<PaymentModal data={modal} onSave={save} onClose={()=>setModal(null)}/>}
    </>
  );
}

function CalendarView({onSendWa,toastFn}){
  const calRef=useRef(null);
  const calInstanceRef=useRef(null);
  const [dayModal,setDayModal]=useState(null);
  const [allCustomEvents,setAllCustomEvents]=useState([]);
  // Filtreler — state (render için) + ref (FullCalendar callback closure için)
  const [filters,setFilters]=useState({personal:true,clients:true,tax:true});
  const filtersRef=useRef({personal:true,clients:true,tax:true});
  const toggleFilter=(k)=>{
    const next={...filtersRef.current,[k]:!filtersRef.current[k]};
    filtersRef.current=next;
    setFilters({...next});
    // Takvimi yeniden çek — takvim destroy olmadan güncellenir
    calInstanceRef.current?.refetchEvents();
  };

  const loadCustomEvents=()=>api('/events').then(setAllCustomEvents).catch(console.error);
  useEffect(()=>{loadCustomEvents();},[]);

  useEffect(()=>{
    if(!calRef.current)return;
    const cal=new FullCalendar.Calendar(calRef.current,{
      locale:'tr',
      headerToolbar:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek'},
      height:'100%',
      events:async(info,ok,fail)=>{
        try{
          const f=filtersRef.current; // Her zaman güncel değeri okur
          const start=info.startStr.split('T')[0];
          const end=info.endStr.split('T')[0];
          const [payments,custom,taxData]=await Promise.all([
            api(`/payments/calendar/events?start=${start}&end=${end}`),
            api('/events'),
            api(`/tax-calendar/year-overview`),
          ]);
          setAllCustomEvents(custom);
          const evs=[];
          // Kişisel ödemeler
          if(f.personal){
            payments.filter(p=>p.is_personal||!p.client_id).forEach(p=>{
              evs.push({id:'p_'+p.id,title:'🏠 '+p.title,start:p.due_date,backgroundColor:p.status==='paid'?'#1C5C34':p.status==='overdue'?'#B5261E':'#7C6FAF',borderColor:'transparent',extendedProps:{type:'payment',category:'personal',...p}});
            });
          }
          // Müşteri ödemeleri
          if(f.clients){
            payments.filter(p=>p.client_id&&!p.is_personal).forEach(p=>{
              evs.push({id:'p_'+p.id,title:(p.client_name?p.client_name+' — ':'')+p.title,start:p.due_date,backgroundColor:p.status==='paid'?'#1C5C34':p.status==='overdue'?'#B5261E':'#C46A00',borderColor:'transparent',extendedProps:{type:'payment',category:'client',...p}});
            });
          }
          // Özel etkinlikler (kişisel kategorisinde)
          if(f.personal){
            custom.forEach(e=>{
              evs.push({id:'e_'+e.id,title:e.title,start:e.date,backgroundColor:e.color||'#1A52A8',borderColor:'transparent',extendedProps:{type:'event',category:'personal',...e}});
            });
          }
          // Vergi takvimi etkinlikleri
          if(f.tax){
            const rangeStart=new Date(start+'T00:00:00');
            const rangeEnd=new Date(end+'T00:00:00');
            taxData.events.forEach(te=>{
              const d=new Date(te.due_date+'T00:00:00');
              if(d>=rangeStart&&d<=rangeEnd){
                evs.push({id:'tax_'+te.due_date+'_'+te.payment_type,title:'🏛 '+te.name,start:te.due_date,backgroundColor:'#0F4C75',borderColor:'transparent',extendedProps:{type:'tax',category:'tax',...te}});
              }
            });
          }
          ok(evs);
        }catch(err){fail(err);}
      },
      eventClick:(info)=>{
        const p=info.event.extendedProps;
        if(p.type==='payment'&&p.client_id)onSendWa({id:p.client_id,full_name:p.client_name,phone:p.client_phone},p);
      },
      dateClick:(info)=>{
        const clickedDate=info.dateStr;
        const calApi=calInstanceRef.current;
        const dayEvents=calApi?calApi.getEvents().filter(e=>e.startStr===clickedDate||e.startStr.startsWith(clickedDate)):[];
        setDayModal({date:clickedDate,events:dayEvents.map(e=>({id:e.id,title:e.title,color:e.backgroundColor,extendedProps:e.extendedProps}))});
      },
    });
    cal.render();
    calInstanceRef.current=cal;
    return()=>cal.destroy();
  },[]); // Sadece mount/unmount — filtreler ref üzerinden yönetilir

  const refetch=()=>{
    calInstanceRef.current?.refetchEvents();
    loadCustomEvents();
  };

  return(
    <>
      {/* Filtre kutucukları */}
      <div className="cal-filter-bar">
        <span className="cal-filter-label">Göster:</span>
        {[
          {key:'personal',label:'🏠 Kişisel',color:'#7C6FAF'},
          {key:'clients', label:'👥 Müşteriler',color:'#C46A00'},
          {key:'tax',     label:'🏛 Vergi Takvimi',color:'#0F4C75'},
        ].map(f=>(
          <label key={f.key} className={`cal-filter-chip ${filters[f.key]?'on':''}`} style={filters[f.key]?{borderColor:f.color,background:f.color+'18',color:f.color}:{}}>
            <input type="checkbox" checked={filters[f.key]} onChange={()=>toggleFilter(f.key)} style={{display:'none'}}/>
            <span className="cal-filter-dot" style={{background:filters[f.key]?f.color:'var(--border)'}}/>
            {f.label}
          </label>
        ))}
        {!filters.personal&&!filters.clients&&!filters.tax&&(
          <span style={{fontSize:12,color:'var(--ink3)',marginLeft:4}}>⚠️ Hiçbir kategori seçili değil</span>
        )}
      </div>
      <div className="card" style={{height:'calc(100vh - 200px)'}}>
        <div className="card-body" style={{height:'100%',padding:16}}>
          <div ref={calRef} style={{height:'100%'}}/>
        </div>
      </div>
      <p className="cal-add-hint">💡 Herhangi bir güne tıklayarak etkinlik ekleyebilir veya o günün etkinliklerini görebilirsiniz.</p>
      {dayModal&&<DayModal date={dayModal.date} events={dayModal.events} allCustomEvents={allCustomEvents} onClose={()=>setDayModal(null)} onRefetch={refetch} toastFn={toastFn} onSendWa={onSendWa}/>}
    </>
  );
}

function DayModal({date,events,allCustomEvents,onClose,onRefetch,toastFn,onSendWa}){
  const [addForm,setAddForm]=useState({title:'',date:date||'',notes:'',color:'#3949AB'});
  const [editingId,setEditingId]=useState(null);
  const [editForm,setEditForm]=useState({});
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  const fmtDate=(d)=>d?new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
  const setA=(k,v)=>setAddForm(f=>({...f,[k]:v}));
  const setE=(k,v)=>setEditForm(f=>({...f,[k]:v}));

  const dayCustomEvents=allCustomEvents.filter(e=>e.date===date);
  const dayPaymentEvents=events.filter(e=>e.extendedProps?.type==='payment');
  const dayTaxEvents=events.filter(e=>e.extendedProps?.type==='tax');

  const addEvent=async()=>{
    if(!addForm.title){setErr('Başlık zorunlu.');return;}
    setLoading(true);setErr('');
    try{
      await api('/events',{method:'POST',body:{...addForm,date:date}});
      toastFn('Etkinlik eklendi ✓');
      onRefetch();
      setAddForm({title:'',date:date,notes:'',color:'#3949AB'});
    }catch(e){setErr(e.message);}finally{setLoading(false);}
  };

  const startEdit=(ev)=>{
    setEditingId(ev.id);
    setEditForm({title:ev.title,date:ev.date,notes:ev.notes||'',color:ev.color||'#3949AB'});
  };

  const saveEdit=async(id)=>{
    setLoading(true);setErr('');
    try{
      await api(`/events/${id}`,{method:'PUT',body:editForm});
      toastFn('Etkinlik güncellendi ✓');
      onRefetch();
      setEditingId(null);
    }catch(e){setErr(e.message);}finally{setLoading(false);}
  };

  const delEvent=async(id)=>{
    if(!confirm('Bu etkinliği silmek istediğinizden emin misiniz?'))return;
    setLoading(true);
    try{
      await api(`/events/${id}`,{method:'DELETE'});
      toastFn('Etkinlik silindi.');
      onRefetch();
    }catch(e){toastFn(e.message,'error');}finally{setLoading(false);}
  };

  return(
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal modal-lg">
        <div className="modal-header">
          <span className="modal-title">📅 {fmtDate(date)}</span>
          <button className="btn-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body" style={{maxHeight:'70vh',overflowY:'auto'}}>
          {err&&<div className="alert alert-error">{err}</div>}

          {/* O günkü etkinlikler */}
          {(dayCustomEvents.length>0||dayPaymentEvents.length>0||dayTaxEvents.length>0)&&(
            <div style={{marginBottom:20}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.6px',color:'var(--ink3)',marginBottom:10}}>Bu Gündeki Etkinlikler</div>

              {/* Vergi takvimi */}
              {dayTaxEvents.map(ev=>(
                <div key={ev.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',background:'#EBF5FF',borderRadius:8,marginBottom:6,border:'1px solid #BDD7EE'}}>
                  <span style={{width:10,height:10,borderRadius:'50%',background:'#0F4C75',flexShrink:0}}/>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:13}}>{ev.extendedProps?.name||ev.title}</div>
                    {ev.extendedProps?.description&&<div style={{fontSize:11,color:'var(--ink3)',marginTop:2}}>{ev.extendedProps.description}</div>}
                  </div>
                  <span style={{fontSize:10,background:'#0F4C75',color:'#fff',padding:'2px 7px',borderRadius:10}}>Vergi</span>
                </div>
              ))}

              {/* Ödeme etkinlikleri */}
              {dayPaymentEvents.map(ev=>{
                const p=ev.extendedProps;
                return(
                  <div key={ev.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',background:'var(--amber2)',borderRadius:8,marginBottom:6,border:'1px solid #FFD9A0'}}>
                    <span style={{width:10,height:10,borderRadius:'50%',background:ev.color,flexShrink:0}}/>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:600,fontSize:13}}>{p.client_name&&<span style={{color:'var(--amber)'}}>{p.client_name} — </span>}{p.title}</div>
                      {p.amount&&<div style={{fontSize:11,color:'var(--ink3)',marginTop:2}}>{parseFloat(p.amount).toLocaleString('tr-TR',{minimumFractionDigits:2})} ₺</div>}
                    </div>
                    {p.client_id&&<button className="btn btn-wa btn-sm" onClick={()=>{onClose();onSendWa({id:p.client_id,full_name:p.client_name,phone:p.client_phone},p);}}>{WA_SVG}</button>}
                  </div>
                );
              })}

              {/* Özel etkinlikler */}
              {dayCustomEvents.map(ev=>(
                <div key={ev.id} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',background:'var(--bg2)',borderRadius:8,marginBottom:6,border:'1px solid var(--border)'}}>
                  <span style={{width:10,height:10,borderRadius:'50%',background:ev.color||'#3949AB',flexShrink:0}}/>
                  {editingId===ev.id?(
                    <div style={{flex:1,display:'grid',gridTemplateColumns:'1fr auto auto',gap:6,alignItems:'center'}}>
                      <input className="form-control" style={{padding:'5px 8px',fontSize:12}} value={editForm.title} onChange={e=>setE('title',e.target.value)}/>
                      <input type="color" value={editForm.color} onChange={e=>setE('color',e.target.value)} style={{width:30,height:28,padding:2,border:'1px solid var(--border)',borderRadius:5,cursor:'pointer'}}/>
                      <div style={{display:'flex',gap:4}}>
                        <button className="btn btn-primary btn-sm" onClick={()=>saveEdit(ev.id)} disabled={loading}><Ico n="check" s={11}/></button>
                        <button className="btn btn-ghost btn-sm" onClick={()=>setEditingId(null)}>✕</button>
                      </div>
                    </div>
                  ):(
                    <>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:600,fontSize:13}}>{ev.title}</div>
                        {ev.notes&&<div style={{fontSize:11,color:'var(--ink3)',marginTop:2}}>{ev.notes}</div>}
                      </div>
                      <button className="btn btn-ghost btn-sm" onClick={()=>startEdit(ev)} title="Düzenle"><Ico n="edit" s={12}/></button>
                      <button className="btn btn-danger btn-sm" onClick={()=>delEvent(ev.id)} title="Sil" disabled={loading}><Ico n="trash" s={12}/></button>
                    </>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* Yeni etkinlik ekleme */}
          <div style={{borderTop:dayCustomEvents.length>0||dayPaymentEvents.length>0||dayTaxEvents.length>0?'1px solid var(--border)':'none',paddingTop:dayCustomEvents.length>0||dayPaymentEvents.length>0||dayTaxEvents.length>0?16:0}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.6px',color:'var(--ink3)',marginBottom:10}}>Yeni Etkinlik Ekle</div>
            <div className="form-group"><label className="form-label">Başlık *</label><input className="form-control" value={addForm.title} onChange={e=>setA('title',e.target.value)} autoFocus placeholder="Etkinlik başlığı..."/></div>
            <div className="form-row c2">
              <div className="form-group"><label className="form-label">Renk</label><input className="form-control" type="color" value={addForm.color} onChange={e=>setA('color',e.target.value)} style={{height:40,padding:4}}/></div>
            </div>
            <div className="form-group"><label className="form-label">Not</label><textarea className="form-control" rows={2} value={addForm.notes} onChange={e=>setA('notes',e.target.value)} placeholder="İsteğe bağlı not..."/></div>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-ghost" onClick={onClose}>Kapat</button>
          <button className="btn btn-primary" onClick={addEvent} disabled={loading||!addForm.title}>
            {loading?<span className="spinner"/>:<Ico n="plus" s={13}/>} Etkinlik Ekle
          </button>
        </div>
      </div>
    </div>
  );
}

function WhatsappModal({client,payment,onClose,toastFn}){
  const [templates,setTemplates]=useState([]);
  const [allClients,setAllClients]=useState([]);
  const [tplId,setTplId]=useState('');
  const [amount,setAmount]=useState(payment?.amount?String(payment.amount):'');
  const [dueDate,setDueDate]=useState(payment?.due_date||'');
  const [custom,setCustom]=useState('');
  const [useCustom,setUseCustom]=useState(false);
  const [clientSearch,setClientSearch]=useState('');
  const [selClient,setSelClient]=useState(client||null);
  const [loading,setLoading]=useState(false);
  const [waData,setWaData]=useState(null);
  const [err,setErr]=useState('');

  useEffect(()=>{
    api('/whatsapp/templates').then(ts=>{
      setTemplates(ts);
      if(payment?.payment_type){const def=ts.find(t=>t.payment_type===payment.payment_type&&t.is_default);if(def)setTplId(def.id);}
    });
    if(!client)api('/clients').then(cs=>setAllClients(cs.filter(c=>c.is_active)));
  },[]);

  const tpl=templates.find(t=>t.id===tplId);
  const preview=tpl&&selClient?tpl.body
    .replace(/\[isim\]/g,selClient.full_name)
    .replace(/\[tutar\]/g,amount?parseFloat(amount).toLocaleString('tr-TR',{minimumFractionDigits:2}):'—')
    .replace(/\[tarih\]/g,dueDate?new Date(dueDate+'T12:00:00').toLocaleDateString('tr-TR'):'—')
    .replace(/\[tür\]/g,payment?PT_MAP[payment.payment_type]?.label||'':''):'';

  const doGenerateLink=async()=>{
    if(!selClient){setErr('Müşteri seçin.');return;}
    if(!useCustom&&!tplId&&!custom){setErr('Taslak seçin veya mesaj yazın.');return;}

      const body={client_id:selClient.id,...(useCustom?{custom_message:custom}:{template_id:tplId||undefined,amount:amount?parseFloat(amount):null,due_date:dueDate||null})};

      setWaData(r);

  };

  const openWa=()=>{
    if(waData?.wa_link){window.open(waData.wa_link,'_blank');toastFn('WhatsApp açıldı — mesajı gönderin! ✓','wa');setTimeout(onClose,800);}
  };

    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal modal-lg">
        <div className="modal-header">
          <span className="modal-title" style={{display:'flex',alignItems:'center',gap:8}}>{WA_SVG} WhatsApp Mesajı Gönder</span>
          <button className="btn-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {waData?(
            <>
              <div className="alert alert-wa" style={{alignItems:'center'}}>
                {WA_SVG} <span>Mesaj hazır! Butona basın, WhatsApp Web açılacak, mesaj yazılı gelecek. Sadece <b>Gönder</b> tuşuna basın.</span>
              </div>
              <div className="wa-phone-label">📱 {waData.client_name} — {waData.phone}</div>
              <div className="wa-preview-wrap"><div className="wa-preview-bubble">{waData.message}</div></div>
              <button className="wa-open-btn" onClick={openWa}>{WA_SVG} WhatsApp Web'de Aç &amp; Gönder</button>
              <p className="wa-hint">WhatsApp Web açılacak — mesajı göndermeden önce düzenleyebilirsiniz.</p>
            </>
          ):(
            <>
              {!client?(
                <div className="form-group">
                  <label className="form-label">Alıcı Müşteri</label>

                    <div style={{border:'1px solid var(--border)',borderRadius:8,marginTop:4,maxHeight:160,overflowY:'auto',background:'#fff',boxShadow:'var(--shadow)'}}>
                      {filteredClients.slice(0,6).map(c=>(
                        <div key={c.id} onClick={()=>{setSelClient(c);setClientSearch('');}} style={{padding:'9px 12px',cursor:'pointer',borderBottom:'1px solid var(--border)',fontSize:13}}>
                          <b>{c.full_name}</b> <span style={{color:'var(--ink3)'}}>— {c.phone}</span>
                        </div>
                      ))}
                      {filteredClients.length===0&&<div style={{padding:'9px 12px',color:'var(--ink3)',fontSize:13}}>Bulunamadı</div>}

              ):(
                <div className="form-group"><label className="form-label">Alıcı</label><div style={{padding:'9px 12px',background:'var(--wa2)',borderRadius:8,fontSize:13,display:'flex',alignItems:'center',gap:8,color:'var(--wa-dark)'}}>{WA_SVG}<b>{selClient?.full_name}</b> — {selClient?.phone}</div></div>
              )}

              <div className="form-group"><label className="checkbox-label"><input type="checkbox" checked={useCustom} onChange={e=>setUseCustom(e.target.checked)}/> Serbest mesaj yaz</label></div>
              {!useCustom?(
                <>
                  <div className="form-group"><label className="form-label">Taslak</label>
                    <select className="form-control" value={tplId} onChange={e=>setTplId(e.target.value)}>
                      <option value="">— Taslak seçin —</option>
                      {templates.map(t=><option key={t.id} value={t.id}>{t.name}{t.is_default?' ★':''}</option>)}
                    </select>
                  </div>
                  <div className="form-row c2">
                    <div className="form-group"><label className="form-label">Tutar (₺)</label><input className="form-control" type="number" value={amount} onChange={e=>setAmount(e.target.value)}/></div>
                    <div className="form-group"><label className="form-label">Son Tarih</label><input className="form-control" type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)}/></div>
                  </div>
                  {preview&&<div className="form-group"><label className="form-label">Önizleme</label><div className="wa-preview-wrap"><div className="wa-preview-bubble">{preview}</div></div></div>}
                </>
              ):(
                <div className="form-group"><label className="form-label">Mesaj</label><textarea className="form-control" rows={5} value={custom} onChange={e=>setCustom(e.target.value)} placeholder="Mesajınızı buraya yazın..."/><div className="char-count">{custom.length} karakter</div></div>
              )}
            </>
          )}
        </div>
        {!waData&&<div className="modal-footer"><button className="btn btn-ghost" onClick={onClose}>İptal</button><button className="btn btn-wa" onClick={doGenerateLink} disabled={loading||!selClient}>{loading?<span className="spinner"/>:WA_SVG} WhatsApp Linki Oluştur</button></div>}
      </div>
    </div>
  );
}


// ── Tahakkuk Fişi ─────────────────────────────────────────────────────────────
function TahakkukFisi({toastFn}){
  const [clients,setClients]=useState([]);
  const [file,setFile]=useState(null);
  const [loading,setLoading]=useState(false);
  const [parsed,setParsed]=useState(null);
  const [matched,setMatched]=useState(null);
  const [satirlar,setSatirlar]=useState([]);
  const [err,setErr]=useState('');
  const [done,setDone]=useState(false);
  const fileRef=React.useRef();

  useEffect(()=>{api('/clients').then(cs=>setClients(cs.filter(c=>c.is_active))).catch(console.error);},[]);

  const fmtAmt=a=>a!=null?parseFloat(a).toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺':'—';

  const onFile=async(e)=>{
    const f=e.target.files[0];
    if(!f)return;
    setFile(f);setParsed(null);setMatched(null);setSatirlar([]);setErr('');setDone(false);
    setLoading(true);
    try{
      const fd=new FormData();
      fd.append('file',f);
      const res=await fetch(`${API_BASE}/api/tahakkuk/parse`,{credentials:'include',method:'POST',body:fd});
      if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.detail||'Parse hatası');}
      const data=await res.json();
      setParsed(data);
      // Vergi no ile müşteri eşleştir
      if(data.vergi_no){
        const found=clients.find(c=>(c.tax_number||'').replace(/\s/g,'')===data.vergi_no.replace(/\s/g,''));
        if(found)setMatched(found);
      }
      // Satırları varsayılan olarak hepsini seç
      setSatirlar((data.satirlar||[]).map(s=>({...s,selected:true})));
    }catch(e){setErr(e.message);}finally{setLoading(false);}
  };

  const apply=async()=>{
    if(!matched){setErr('Müşteri seçilmedi.');return;}
    const secilenler=satirlar.filter(s=>s.selected&&s.payment_type&&s.odenecek);
    if(!secilenler.length){setErr('En az bir vergi satırı seçilmeli.');return;}
    setLoading(true);setErr('');
    try{
      await api('/tahakkuk/apply',{method:'POST',body:{client_id:matched.id,satirlar:secilenler}});
      toastFn(`${secilenler.length} ödeme başarıyla oluşturuldu ✓`);
      setDone(true);
    }catch(e){setErr(e.message);}finally{setLoading(false);}
  };

  const reset=()=>{setFile(null);setParsed(null);setMatched(null);setSatirlar([]);setErr('');setDone(false);if(fileRef.current)fileRef.current.value='';};

  const toggleSatir=(i)=>setSatirlar(s=>s.map((x,j)=>j===i?{...x,selected:!x.selected}:x));
  const setAmount=(i,v)=>setSatirlar(s=>s.map((x,j)=>j===i?{...x,odenecek:parseFloat(v)||0}:x));
  const setType=(i,v)=>setSatirlar(s=>s.map((x,j)=>j===i?{...x,payment_type:v}:x));

  return(
    <div style={{maxWidth:860}}>
      {/* Yükleme alanı */}
      {!parsed&&!loading&&(
        <div className="card">
          <div className="card-header"><span className="card-title">📄 Tahakkuk Fişi Yükle</span></div>
          <div className="card-body">
            <div style={{border:'2px dashed var(--border)',borderRadius:12,padding:48,textAlign:'center',cursor:'pointer',background:'var(--bg)',transition:'border-color .15s'}}
              onClick={()=>fileRef.current?.click()}
              onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--green)'}}
              onDragLeave={e=>{e.currentTarget.style.borderColor='var(--border)'}}
              onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f){const inp=fileRef.current;const dt=new DataTransfer();dt.items.add(f);inp.files=dt.files;onFile({target:inp});}}}>
              <div style={{fontSize:48,marginBottom:12}}>📄</div>
              <div style={{fontFamily:'var(--serif)',fontSize:17,marginBottom:6}}>Tahakkuk fişini buraya sürükle veya tıkla</div>
              <div style={{fontSize:12,color:'var(--ink3)'}}>PDF, JPG veya PNG — T.C. Maliye Bakanlığı Tahakkuk Fişi</div>
            </div>
            <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png" style={{display:'none'}} onChange={onFile}/>
            {err&&<div className="alert alert-error" style={{marginTop:16}}>{err}</div>}
          </div>
        </div>
      )}

      {/* Yükleniyor */}
      {loading&&(
        <div className="card"><div className="card-body" style={{textAlign:'center',padding:60}}>
          <span className="spinner spinner-dark" style={{width:32,height:32,marginBottom:16,display:'inline-block'}}/>
          <div style={{fontFamily:'var(--serif)',fontSize:16,color:'var(--ink2)'}}>Fiş okunuyor ve analiz ediliyor...</div>
        </div></div>
      )}

      {/* Sonuç */}
      {parsed&&!loading&&!done&&(
        <>
          {/* Müşteri eşleştirme */}
          <div className="card" style={{marginBottom:16}}>
            <div className="card-header"><span className="card-title">👤 Müşteri Eşleştirme</span></div>
            <div className="card-body">
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
                <div>
                  <div className="form-label">Fişten Okunan</div>
                  <div style={{background:'var(--bg)',borderRadius:8,padding:'10px 14px',fontSize:13}}>
                    <div><b>Vergi No:</b> {parsed.vergi_no||<span className="text-muted">Okunamadı</span>}</div>
                    <div><b>Ad:</b> {parsed.ad||<span className="text-muted">Okunamadı</span>}</div>
                    {parsed.vadesi&&<div><b>Vade:</b> {new Date(parsed.vadesi).toLocaleDateString('tr-TR')}</div>}
                  </div>
                </div>
                <div>
                  <div className="form-label">Sistemdeki Müşteri {matched&&<span className="badge badge-green" style={{marginLeft:6}}>Otomatik Eşleşti ✓</span>}</div>
                  <select className="form-control" value={matched?.id||''} onChange={e=>setMatched(clients.find(c=>c.id===e.target.value)||null)}>
                    <option value="">— Müşteri seçin —</option>
                    {clients.map(c=><option key={c.id} value={c.id}>{c.full_name} {c.tax_number?`(${c.tax_number})`:''}</option>)}
                  </select>
                  {!matched&&parsed.vergi_no&&<div className="alert alert-info" style={{marginTop:8,fontSize:12}}>Vergi no ({parsed.vergi_no}) sistemde bulunamadı. Lütfen müşteriyi seçin veya önce müşteri ekleyin.</div>}
                </div>
              </div>
            </div>
          </div>

          {/* Vergi satırları */}
          <div className="card" style={{marginBottom:16}}>
            <div className="card-header">
              <span className="card-title">💰 Vergi Satırları</span>
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-ghost btn-sm" onClick={()=>setSatirlar(s=>s.map(x=>({...x,selected:true})))}>Tümünü Seç</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>setSatirlar(s=>s.map(x=>({...x,selected:false})))}>Hiçbirini Seçme</button>
              </div>
            </div>
            <div className="table-wrap">
              <table>
                <thead><tr><th style={{width:40}}></th><th>Kod</th><th>Tür</th><th>Ödenecek Tutar</th><th>Vade</th><th>Sistem Türü</th></tr></thead>
                <tbody>
                  {satirlar.length===0&&<tr><td colSpan={6}><div className="empty"><div className="empty-icon">🔍</div><p>Vergi satırı okunamadı</p></div></td></tr>}
                  {satirlar.map((s,i)=>(
                    <tr key={i} style={{opacity:s.selected?1:.45}}>
                      <td><input type="checkbox" checked={s.selected} onChange={()=>toggleSatir(i)}/></td>
                      <td><span style={{fontFamily:'monospace',fontSize:12}}>{s.tur_kodu}</span></td>
                      <td className="fw-600">{s.tur_adi}</td>
                      <td>
                        <input type="number" className="form-control" style={{width:120,display:'inline-block'}}
                          value={s.odenecek||''} onChange={e=>setAmount(i,e.target.value)}/>
                        <span style={{marginLeft:6,fontSize:12,color:'var(--ink3)'}}>₺</span>
                      </td>
                      <td style={{fontSize:12}}>{s.vadesi?new Date(s.vadesi).toLocaleDateString('tr-TR'):'—'}</td>
                      <td>
                        {s.payment_type?(
                          <TypeBadge type={s.payment_type}/>
                        ):(
                          <select className="form-control" style={{fontSize:11,padding:'3px 6px'}} value={s.payment_type||''} onChange={e=>setType(i,e.target.value)}>
                            <option value="">— Seçin —</option>
                            {Object.entries(PT_MAP).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                          </select>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {err&&<div className="alert alert-error">{err}</div>}

          <div style={{display:'flex',gap:12,justifyContent:'flex-end'}}>
            <button className="btn btn-ghost" onClick={reset}>İptal / Yeni Fiş</button>
            <button className="btn btn-primary" onClick={apply} disabled={loading||!matched||!satirlar.some(s=>s.selected)}>
              {loading?<span className="spinner"/>:<Ico n="check" s={14}/>} Ödemeleri Sisteme Ekle ({satirlar.filter(s=>s.selected).length} kalem)
            </button>
          </div>
        </>
      )}

      {/* Başarı */}
      {done&&(
        <div className="card"><div className="card-body" style={{textAlign:'center',padding:60}}>
          <div style={{fontSize:56,marginBottom:16}}>✅</div>
          <div style={{fontFamily:'var(--serif)',fontSize:20,marginBottom:8}}>Ödemeler başarıyla oluşturuldu!</div>
          <div style={{color:'var(--ink3)',fontSize:13,marginBottom:24}}>Ödemeler sayfasında görebilirsiniz.</div>
          <button className="btn btn-primary" onClick={reset}>Yeni Fiş Yükle</button>
        </div></div>
      )}
    </div>
  );
}

function PersonalFinance({toastFn}){
  const today=new Date();
  const [selMonth,setSelMonth]=useState(`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`);
  const [dirFilter,setDirFilter]=useState('');
  const [records,setRecords]=useState([]);
  const [summary,setSummary]=useState(null);
  const [categories,setCategories]=useState([]);
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({title:'',amount:'',due_date:new Date().toISOString().split('T')[0],direction:'expense',category:'Diğer',recurrence:''});

  const load=()=>{
    let url=`/personal?month=${selMonth}`;
    if(dirFilter)url+=`&direction=${dirFilter}`;
    api(url).then(setRecords).catch(console.error);
    api(`/personal/summary?month=${selMonth}`).then(setSummary).catch(console.error);
  };
  useEffect(()=>{
    api('/personal/categories').then(setCategories).catch(console.error);
  },[]);
  useEffect(()=>{load();},[selMonth,dirFilter]);

  const markPaid=async(id)=>{await api(`/personal/${id}/mark-paid`,{method:'POST'});toastFn('Ödendi ✓');load();};
  const del=async(id)=>{if(!confirm('Silinsin mi?'))return;await api(`/personal/${id}`,{method:'DELETE'});toastFn('Silindi.');load();};
  const save=async()=>{
    if(!form.title||!form.amount||!form.due_date){toastFn('Başlık, tutar ve tarih zorunlu.','error');return;}
    try{
      await api('/personal',{method:'POST',body:{...form,amount:parseFloat(form.amount)}});
      toastFn('Kaydedildi.');setModal(false);
      setForm({title:'',amount:'',due_date:new Date().toISOString().split('T')[0],direction:'expense',category:'Diğer',recurrence:''});
      load();
    }catch(e){toastFn(e.message,'error');}
  };

  const fmtAmt=a=>parseFloat(a||0).toLocaleString('tr-TR',{minimumFractionDigits:2})+' ₺';
  const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('tr-TR');
  const today2=new Date().toISOString().split('T')[0];

  // Ay seçici için son 12 ay
  const monthOptions=[];
  for(let i=0;i<12;i++){
    const d=new Date(today.getFullYear(),today.getMonth()-i,1);
    const val=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label=d.toLocaleDateString('tr-TR',{month:'long',year:'numeric'});
    monthOptions.push({val,label});
  }

  const incomeCategories=['Danışmanlık Geliri','Kira Geliri','Diğer Gelir'];

  return(
    <>
      {/* Özet Kartlar */}
      {summary&&(
        <div className="stats-grid" style={{gridTemplateColumns:'repeat(4,1fr)',marginBottom:20}}>
          <div className="stat" style={{'--before-color':'var(--green)'}}>
            <div className="stat-label">Toplam Gelir</div>
            <div className="stat-value" style={{fontSize:22,color:'var(--green)'}}>{fmtAmt(summary.total_income)}</div>
            <div className="stat-sub">bu ay</div>
          </div>
          <div className="stat danger">
            <div className="stat-label">Toplam Gider</div>
            <div className="stat-value" style={{fontSize:22}}>{fmtAmt(summary.total_expense)}</div>
            <div className="stat-sub">{fmtAmt(summary.pending_expense)} bekliyor</div>
          </div>
          <div className="stat" style={{borderTop:`3px solid ${summary.net>=0?'var(--green)':'var(--red)'}`}}>
            <div className="stat-label">Net {summary.net>=0?'Kâr':'Zarar'}</div>
            <div className="stat-value" style={{fontSize:22,color:summary.net>=0?'var(--green)':'var(--red)'}}>{fmtAmt(Math.abs(summary.net))}</div>
            <div className="stat-sub">gelir − gider</div>
          </div>
          <div className="stat wa">
            <div className="stat-label">Ödenen Gider</div>
            <div className="stat-value" style={{fontSize:22}}>{fmtAmt(summary.paid_expense)}</div>
            <div className="stat-sub">bu ay ödendi</div>
          </div>
        </div>
      )}

      {/* Kategori Dağılımı */}
      {summary&&summary.category_breakdown.length>0&&(
        <div className="card" style={{marginBottom:18}}>
          <div className="card-header"><span className="card-title">📊 Gider Dağılımı</span></div>
          <div className="card-body" style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {summary.category_breakdown.map(c=>(
              <div key={c.category} style={{background:'var(--bg2)',borderRadius:8,padding:'8px 14px',fontSize:13}}>
                <span style={{color:'var(--ink3)',marginRight:6}}>{c.category}</span>
                <span className="fw-600">{fmtAmt(c.amount)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Ana Tablo */}
      <div className="card">
        <div className="card-header">
          <span className="card-title">💼 Kişisel Gelir & Giderler</span>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <select className="form-control" style={{width:170}} value={selMonth} onChange={e=>setSelMonth(e.target.value)}>
              {monthOptions.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}
            </select>
            <div className="filter-chips">
              <button className={`chip ${dirFilter===''?'active':''}`} onClick={()=>setDirFilter('')}>Tümü</button>
              <button className={`chip ${dirFilter==='income'?'active':''}`} onClick={()=>setDirFilter('income')} style={dirFilter==='income'?{background:'var(--green)',borderColor:'var(--green)'}:{}}>📥 Gelir</button>
              <button className={`chip ${dirFilter==='expense'?'active':''}`} onClick={()=>setDirFilter('expense')} style={dirFilter==='expense'?{background:'var(--red)',borderColor:'var(--red)'}:{}}>📤 Gider</button>
            </div>
            <button className="btn btn-primary btn-sm" onClick={()=>setModal(true)}><Ico n="plus" s={13}/> Yeni Kayıt</button>
          </div>
        </div>
        <div className="table-wrap" style={{maxHeight:500,overflowY:'auto'}}><table>
          <thead className="sticky-thead">
            <tr><th>Tarih</th><th>Yön</th><th>Kategori</th><th>Başlık</th><th>Tutar</th><th>Durum</th><th>Tekrar</th><th></th></tr>
          </thead>
          <tbody>
            {records.length===0&&<tr><td colSpan={8}><div className="empty"><div className="empty-icon">💼</div><p>Bu ay kayıt yok</p></div></td></tr>}
            {records.map(r=>{
              const overdue=r.status==='pending'&&r.due_date<today2;
              const isIncome=r.direction==='income';
              return(
                <tr key={r.id}>
                  <td style={{fontSize:12}}>{fmtDate(r.due_date)}</td>
                  <td>{isIncome
                    ?<span className="badge badge-green">📥 Gelir</span>
                    :<span className="badge badge-red">📤 Gider</span>}
                  </td>
                  <td><span className="badge badge-gray">{r.category}</span></td>
                  <td className="fw-600">{r.title}</td>
                  <td className="fw-600" style={{color:isIncome?'var(--green)':'var(--red)'}}>
                    {isIncome?'+':'-'}{fmtAmt(r.amount)}
                  </td>
                  <td>
                    {r.status==='paid'
                      ?<span className="badge badge-green">✓ Tamamlandı</span>
                      :overdue
                        ?<span className="badge badge-red">Gecikmiş</span>
                        :<span className="badge badge-amber">Bekliyor</span>}
                  </td>
                  <td style={{fontSize:11,color:'var(--ink3)'}}>
                    {r.recurrence==='monthly'?'🔄 Aylık':r.recurrence==='yearly'?'🔄 Yıllık':'—'}
                  </td>
                  <td><div style={{display:'flex',gap:5}}>
                    {r.status!=='paid'&&<button className="btn btn-ghost btn-sm" onClick={()=>markPaid(r.id)} title="Tamamlandı"><Ico n="check" s={12}/></button>}
                    <button className="btn btn-danger btn-sm" onClick={()=>del(r.id)}><Ico n="trash" s={12}/></button>
                  </div></td>
                </tr>
              );
            })}
          </tbody>
        </table></div>
      </div>

      {/* Yeni Kayıt Modal */}
      {modal&&(
        <div className="overlay" onClick={e=>e.target===e.currentTarget&&setModal(false)}>
          <div className="modal">
            <div className="modal-header">
              <span className="modal-title">💼 Yeni Kişisel Kayıt</span>
              <button className="btn-close" onClick={()=>setModal(false)}>×</button>
            </div>
            <div className="modal-body">
              {/* Gelir / Gider toggle */}
              <div className="form-group">
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:0,borderRadius:8,overflow:'hidden',border:'1.5px solid var(--border)'}}>
                  <button onClick={()=>setForm(f=>({...f,direction:'expense',category:f.category&&incomeCategories.includes(f.category)?'Diğer':f.category}))}
                    style={{padding:'10px',fontWeight:600,fontSize:13,border:'none',cursor:'pointer',background:form.direction==='expense'?'var(--red)':'var(--white)',color:form.direction==='expense'?'#fff':'var(--ink3)',transition:'all .15s'}}>
                    📤 Gider
                  </button>
                  <button onClick={()=>setForm(f=>({...f,direction:'income',category:'Danışmanlık Geliri'}))}
                    style={{padding:'10px',fontWeight:600,fontSize:13,border:'none',cursor:'pointer',background:form.direction==='income'?'var(--green)':'var(--white)',color:form.direction==='income'?'#fff':'var(--ink3)',transition:'all .15s'}}>
                    📥 Gelir
                  </button>
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Başlık *</label>
                <input className="form-control" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder={form.direction==='income'?'Danışmanlık ücreti, kira geliri...':'Kira, elektrik, SGK primi...'}/>
              </div>
              <div className="form-row c2">
                <div className="form-group">
                  <label className="form-label">Tutar (₺) *</label>
                  <input className="form-control" type="number" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="0.00"/>
                </div>
                <div className="form-group">
                  <label className="form-label">Tarih *</label>
                  <input className="form-control" type="date" value={form.due_date} onChange={e=>setForm(f=>({...f,due_date:e.target.value}))}/>
                </div>
              </div>
              <div className="form-row c2">
                <div className="form-group">
                  <label className="form-label">Kategori</label>
                  <select className="form-control" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
                    {(form.direction==='income'
                      ?categories.filter(c=>incomeCategories.includes(c))
                      :categories.filter(c=>!incomeCategories.includes(c))
                    ).map(c=><option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Tekrar</label>
                  <select className="form-control" value={form.recurrence} onChange={e=>setForm(f=>({...f,recurrence:e.target.value}))}>
                    <option value="">Yok</option>
                    <option value="monthly">Aylık</option>
                    <option value="yearly">Yıllık</option>
                  </select>
                </div>
              </div>
            </div>
            <div className="modal-footer">
              <button className="btn btn-ghost" onClick={()=>setModal(false)}>İptal</button>
              <button className={`btn ${form.direction==='income'?'btn-primary':'btn-danger'}`} onClick={save}>
                <Ico n="check" s={13}/> {form.direction==='income'?'Gelir Ekle':'Gider Ekle'}
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function WaIncoming({toastFn}){
  const [invoices,setInvoices]=useState([]);
  const [clients,setClients]=useState([]);
  const [processModal,setProcessModal]=useState(null);
  const [pForm,setPForm]=useState({client_id:'',title:'',amount:'',due_date:'',payment_type:'muhasebe_ucreti'});
  const [loading,setLoading]=useState(false);
  const load=()=>{
    api('/wa-incoming/incoming-invoices').then(setInvoices).catch(()=>{});
    api('/clients').then(cs=>setClients(cs.filter(c=>c.is_active))).catch(()=>{});
  };
  useEffect(()=>{load();},[]);
  const setP=(k,v)=>setPForm(f=>({...f,[k]:v}));
  const openProcess=(inv)=>{
    setProcessModal(inv);
    setPForm({client_id:inv.client_id||'',title:`WhatsApp Fatura — ${inv.client_name||inv.phone}`,amount:'',due_date:new Date().toISOString().split('T')[0],payment_type:'muhasebe_ucreti'});
  };
  const processInvoice=async()=>{
    if(!pForm.client_id){toastFn('Müşteri seçin.','error');return;}
    setLoading(true);
    try{
      await api(`/wa-incoming/incoming-invoices/${processModal.id}/process`,{method:'POST',body:pForm});
      toastFn('Fatura sisteme kaydedildi ✓');

                <td><span className={`badge ${inv.status==='pending'?'badge-amber':'badge-green'}`}>{inv.status==='pending'?'Bekliyor':'İşlendi'}</span></td>
                <td>{inv.status==='pending'&&<button className="btn btn-primary btn-sm" onClick={()=>openProcess(inv)}><Ico n="check" s={12}/> Kaydet</button>}</td>

      {processModal&&(

          <div className="modal">

              <div className="form-row c2">
                <div className="form-group"><label className="form-label">Tutar (₺)</label><input className="form-control" type="number" value={pForm.amount} onChange={e=>setP('amount',e.target.value)}/></div>
                <div className="form-group"><label className="form-label">Vade Tarihi</label><input className="form-control" type="date" value={pForm.due_date} onChange={e=>setP('due_date',e.target.value)}/></div>

                  {Object.entries(PT_MAP).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                </select>

            </div>
          </div>
        </div>
      )}
    </>
  );
}
