function TaxCalendar({toastFn}){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth()+1);
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(false);
  const [autoLoading,setAutoLoading]=useState(false);
  const [autoResult,setAutoResult]=useState(null);
  const [selTypes,setSelTypes]=useState([]);
  const [overwrite,setOverwrite]=useState(false);

  const MONTHS=['','Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const years=[today.getFullYear()-1,today.getFullYear(),today.getFullYear()+1];

  const load=()=>{
    setLoading(true);setData(null);setAutoResult(null);
    api(`/tax-calendar/events?year=${year}&month=${month}`)
      .then(setData).catch(e=>toastFn(e.message,'error')).finally(()=>setLoading(false));
  };
  useEffect(()=>{load();},[year,month]);

  const toggleType=(t)=>setSelTypes(prev=>prev.includes(t)?prev.filter(x=>x!==t):[...prev,t]);

  const autoCreate=async()=>{
    setAutoLoading(true);setAutoResult(null);
    try{
      const r=await api('/tax-calendar/auto-create',{method:'POST',body:{year,month,payment_types:selTypes,overwrite}});
      setAutoResult(r);
      toastFn(`${r.created} ödeme oluşturuldu, ${r.skipped} atlandı.`);
    }catch(e){toastFn(e.message,'error');}finally{setAutoLoading(false);}
  };

  const APPLIES_LABEL={'monthly':'Her Ay','quarterly':'3 Aylık','annual':'Yıllık','biannual':'6 Aylık'};
  const APPLIES_COLOR={'monthly':'badge-green','quarterly':'badge-amber','annual':'badge-red','biannual':'badge-red'};

  return(
    <div>
      {/* Ay seçici */}
      <div className="card" style={{marginBottom:16}}>
        <div className="card-header">
          <span className="card-title">🗓️ Türkiye Vergi Takvimi</span>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <select className="form-control" style={{width:90}} value={year} onChange={e=>setYear(+e.target.value)}>
              {years.map(y=><option key={y} value={y}>{y}</option>)}
            </select>
            <select className="form-control" style={{width:120}} value={month} onChange={e=>setMonth(+e.target.value)}>
              {MONTHS.slice(1).map((m,i)=><option key={i+1} value={i+1}>{m}</option>)}
            </select>
          </div>
        </div>
        <div className="card-body" style={{padding:0}}>
          {loading&&<div style={{padding:32,textAlign:'center'}}><span className="spinner"/></div>}
          {data&&(
            <div className="table-wrap"><table>
              <thead className="sticky-thead"><tr><th>Vade Tarihi</th><th>Vergi / Yükümlülük</th><th>Tür</th><th>Sıklık</th><th>Açıklama</th></tr></thead>
              <tbody>
                {data.events.length===0&&<tr><td colSpan={5}><div className="empty"><div className="empty-icon">✅</div><p>Bu ay için vergi yükümlülüğü yok</p></div></td></tr>}
                {data.events.map((ev,i)=>(
                  <tr key={i}>
                    <td><span className="badge badge-amber">{new Date(ev.due_date+'T12:00:00').toLocaleDateString('tr-TR')}</span></td>
                    <td className="fw-600">{ev.name}</td>
                    <td><TypeBadge type={ev.payment_type}/></td>
                    <td><span className={`badge ${APPLIES_COLOR[ev.applies_to]||'badge-amber'}`}>{APPLIES_LABEL[ev.applies_to]||ev.applies_to}</span></td>
                    <td style={{fontSize:12,color:'var(--ink3)'}}>{ev.description}</td>
                  </tr>
                ))}
              </tbody>
            </table></div>
          )}
        </div>
      </div>

      {/* Otomatik ödeme oluştur */}
      {data&&data.events.length>0&&(
        <div className="card">
          <div className="card-header"><span className="card-title">⚡ Otomatik Ödeme Oluştur</span></div>
          <div className="card-body">
            <p style={{fontSize:13,color:'var(--ink3)',marginBottom:12}}>
              Seçili vergi türleri için tüm aktif müşterilere <b>{MONTHS[month]} {year}</b> ödemeleri otomatik oluşturulur.
            </p>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
              {[...new Set(data.events.map(e=>e.payment_type))].map(t=>(
                <button key={t} className={`chip ${selTypes.includes(t)?'active':''}`} onClick={()=>toggleType(t)}>
                  {selTypes.includes(t)?'✓ ':''}<TypeBadge type={t}/>
                </button>
              ))}
              <button className="chip" style={{marginLeft:'auto'}} onClick={()=>setSelTypes(selTypes.length?[]:[...new Set(data.events.map(e=>e.payment_type))])}>
                {selTypes.length?'Hiçbirini Seçme':'Tümünü Seç'}
              </button>
            </div>
            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:13,marginBottom:14,cursor:'pointer'}}>
              <input type="checkbox" checked={overwrite} onChange={e=>setOverwrite(e.target.checked)}/>
              Zaten var olan ödemelerin üzerine yaz (dikkatli kullan)
            </label>
            {autoResult&&(
              <div className="alert alert-info" style={{marginBottom:12,fontSize:13}}>
                ✅ <b>{autoResult.created}</b> ödeme oluşturuldu &nbsp;·&nbsp; <b>{autoResult.skipped}</b> atlandı &nbsp;·&nbsp; {autoResult.clients_processed} müşteri işlendi
              </div>
            )}
            <button className="btn btn-primary" onClick={autoCreate} disabled={autoLoading||!selTypes.length}>
              {autoLoading?<span className="spinner"/>:'⚡'} Seçili Türler İçin Ödemeleri Oluştur ({selTypes.length} tür)
            </button>
          </div>
        </div>
      )}
    </div>
  );
}


// ── Hatırlatma Ayarları ───────────────────────────────────
function ReminderSettings({toastFn}){
  const [rules,setRules]=useState([]);
  const [logs,setLogs]=useState([]);
  const [form,setForm]=useState({name:'',days_before:3,payment_type:'',is_active:true});
  const [editing,setEditing]=useState(null);
  const [loading,setLoading]=useState(false);
  const [runLoading,setRunLoading]=useState(false);
  const [runResult,setRunResult]=useState(null);
  const [status,setStatus]=useState(null);
  const loadStatus=()=>api('/reminders/status').then(setStatus).catch(()=>{});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  const loadRules=()=>api('/reminders/rules').then(setRules).catch(console.error);
  const loadLogs=()=>api('/reminders/logs?limit=30').then(setLogs).catch(console.error);
  useEffect(()=>{loadRules();loadLogs();loadStatus();},[]);

  const save=async()=>{
    if(!form.name){toastFn('Kural adı zorunlu.','error');return;}
    setLoading(true);
    try{
      const body={...form,days_before:+form.days_before,payment_type:form.payment_type||null};
      if(editing){await api(`/reminders/rules/${editing}`,{method:'PUT',body});}
      else{await api('/reminders/rules',{method:'POST',body});}
      toastFn('Kaydedildi ✓');
      setForm({name:'',days_before:3,payment_type:'',is_active:true});
      setEditing(null);loadRules();
    }catch(e){toastFn(e.message,'error');}finally{setLoading(false);}
  };

  const startEdit=(r)=>{
    setEditing(r.id);
    setForm({name:r.name,days_before:r.days_before,payment_type:r.payment_type||'',is_active:r.is_active});
  };

  const del=async(id)=>{
    if(!confirm('Kural silinsin mi?'))return;
    await api(`/reminders/rules/${id}`,{method:'DELETE'});
    toastFn('Silindi.');loadRules();
  };

  const toggle=async(r)=>{
    await api(`/reminders/rules/${r.id}`,{method:'PUT',body:{...r,is_active:!r.is_active,payment_type:r.payment_type||null}});
    loadRules();
  };

  const runNow=async()=>{
    setRunLoading(true);setRunResult(null);
    try{
      const r=await api('/reminders/run-now',{method:'POST',body:{}});
      setRunResult(r);
      toastFn(r.sent>0?`${r.sent} hatırlatma hazırlandı ✓`:'Yeni hatırlatma yok.');
      loadStatus();
    }
    catch(e){toastFn(e.message,'error');}finally{setRunLoading(false);loadLogs();}
  };

  const PT_OPTIONS=[
    {v:'',l:'Tüm Türler'},
    {v:'kdv',l:'KDV'},{v:'stopaj',l:'Stopaj'},{v:'muhasebe_ucreti',l:'Muhasebe Ücreti'},
    {v:'gelir_vergisi',l:'Gelir Vergisi'},{v:'gecici_vergi',l:'Geçici Vergi'},
    {v:'sgk',l:'SGK'},{v:'damga_vergisi',l:'Damga Vergisi'},
  ];

  const STATUS_COLOR={logged:'badge-amber',sent:'badge-green',pending:'badge-amber',failed:'badge-red',skipped:'badge-green'};

  return(
    <div style={{display:'flex',flexDirection:'column',gap:20}}>

      {/* Kural listesi */}
      <div className="card">
        <div className="card-header"><span className="card-title">🔔 Hatırlatma Kuralları</span></div>
        <div className="table-wrap"><table>
          <thead className="sticky-thead"><tr><th>Kural Adı</th><th>Ne Zaman</th><th>Ödeme Türü</th><th>Durum</th><th></th></tr></thead>
          <tbody>
            {rules.length===0&&<tr><td colSpan={5}><div className="empty"><div className="empty-icon">🔔</div><p>Henüz kural yok — aşağıdan ekle</p></div></td></tr>}
            {rules.map(r=>(
              <tr key={r.id} style={{opacity:r.is_active?1:.5}}>
                <td className="fw-600">{r.name}</td>
                <td><span className="badge badge-amber">Vade - {r.days_before} gün</span></td>
                <td>{r.payment_type?<TypeBadge type={r.payment_type}/>:<span className="text-muted">Tüm Türler</span>}</td>
                <td>
                  <button onClick={()=>toggle(r)} style={{background:'none',border:'none',cursor:'pointer',fontSize:18}} title={r.is_active?'Pasife al':'Aktif et'}>
                    {r.is_active?'🟢':'⚪'}
                  </button>
                </td>
                <td><div style={{display:'flex',gap:5}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>startEdit(r)}><Ico n="edit" s={12}/></button>
                  <button className="btn btn-danger btn-sm" onClick={()=>del(r.id)}><Ico n="trash" s={12}/></button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>

      {/* Kural ekle / düzenle */}
      <div className="card">
        <div className="card-header">
          <span className="card-title">{editing?'Kuralı Düzenle':'➕ Yeni Kural Ekle'}</span>
          {editing&&<button className="btn btn-ghost btn-sm" onClick={()=>{setEditing(null);setForm({name:'',days_before:3,payment_type:'',is_active:true});}}>İptal</button>}
        </div>
        <div className="card-body">
          <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}}>
            <div className="form-group" style={{flex:2,minWidth:160}}>
              <label className="form-label">Kural Adı</label>
              <input className="form-control" placeholder="Örn: 3 Gün Önce" value={form.name} onChange={e=>set('name',e.target.value)}/>
            </div>
            <div className="form-group" style={{width:140}}>
              <label className="form-label">Vade Öncesi (Gün)</label>
              <input className="form-control" type="number" min="0" max="30" value={form.days_before} onChange={e=>set('days_before',e.target.value)}/>
            </div>
            <div className="form-group" style={{flex:1,minWidth:150}}>
              <label className="form-label">Ödeme Türü</label>
              <select className="form-control" value={form.payment_type} onChange={e=>set('payment_type',e.target.value)}>
                {PT_OPTIONS.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Durum</label>
              <select className="form-control" value={form.is_active?'1':'0'} onChange={e=>set('is_active',e.target.value==='1')}>
                <option value="1">Aktif</option>
                <option value="0">Pasif</option>
              </select>
            </div>
            <button className="btn btn-primary" onClick={save} disabled={loading} style={{marginBottom:16}}>
              {loading?<span className="spinner"/>:<Ico n="check" s={14}/>} {editing?'Güncelle':'Ekle'}
            </button>
          </div>
          <div className="alert alert-info" style={{fontSize:12}}>
            💡 Birden fazla kural ekleyebilirsin — örneğin "3 Gün Önce" ve "1 Gün Önce" kurallarını aynı anda aktif tutarsan müşteriye iki ayrı hatırlatma gider.
            Scheduler her sabah 08:30'da otomatik çalışır.
          </div>
        </div>
      </div>

      {/* Manuel tetikleme */}
      <div className="card">
        <div className="card-header"><span className="card-title">⚙️ Scheduler Durumu</span></div>
        <div className="card-body">
          {status&&(
            <div style={{display:'flex',gap:16,flexWrap:'wrap',marginBottom:14}}>
              <div style={{fontSize:13}}>
                <span style={{color:'var(--ink3)'}}>Son kontrol: </span>
                <b>{status.last_check?new Date(status.last_check+'T12:00:00').toLocaleDateString('tr-TR'):'Hiç çalışmadı'}</b>
              </div>
              {status.missed_days>0&&(
                <div className="badge badge-amber">
                  ⚠️ {status.missed_days} gün kaçırıldı — uygulama açılışında telafi edildi
                </div>
              )}
              {status.missed_days===0&&status.last_check&&(
                <div className="badge badge-green">✓ Güncel</div>
              )}
              <div style={{fontSize:13}}>
                <span style={{color:'var(--ink3)'}}>Bekleyen log: </span>
                <b>{status.pending_logs}</b>
              </div>
            </div>
          )}
          <p style={{fontSize:13,color:'var(--ink3)',marginBottom:12}}>
            Uygulama her açıldığında otomatik tarama yapılır. Hafta sonu veya tatil günleri kaçırılsa bile
            bir sonraki açılışta telafi edilir — vadesi geçmemiş ödemeler için hatırlatma hazırlanır.
          </p>
          {runResult&&(
            <div className="alert alert-info" style={{marginBottom:12,fontSize:13}}>
              ✅ {runResult.sent} hatırlatma hazırlandı &nbsp;·&nbsp; {runResult.skipped} atlandı
            </div>
          )}
          <button className="btn btn-ghost" onClick={runNow} disabled={runLoading}>
            {runLoading?<span className="spinner"/>:'▶'} Şimdi Çalıştır
          </button>
        </div>
      </div>

      {/* Son loglar */}
      <div className="card">
        <div className="card-header"><span className="card-title">📋 Son Hatırlatma Logları</span></div>
        <div className="table-wrap" style={{maxHeight:320,overflowY:'auto'}}><table>
          <thead className="sticky-thead"><tr><th>Müşteri</th><th>Durum</th><th>Oluşturulma</th><th>Mesaj</th></tr></thead>
          <tbody>
            {logs.length===0&&<tr><td colSpan={4}><div className="empty"><div className="empty-icon">📋</div><p>Henüz log yok</p></div></td></tr>}
            {logs.map(l=>(
              <tr key={l.id}>
                <td className="fw-600">{l.client_name||l.phone}</td>
                <td><span className={`badge ${STATUS_COLOR[l.status]||'badge-amber'}`}>{l.status}</span></td>
                <td style={{fontSize:12}}>{l.created_at?new Date(l.created_at).toLocaleString('tr-TR'):'-'}</td>
                <td style={{fontSize:12,maxWidth:300,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.message_body}</td>
              </tr>
            ))}
          </tbody>
        </table></div>
      </div>

    </div>
  );
}

function App(){
  const [authState,setAuthState]=useState('loading');
  const [username,setUsername]=useState('');
  const [page,setPage]=useState('dashboard');
  const [waModal,setWaModal]=useState(null);
  const [toast,setToast]=useState({msg:'',type:'success'});
  const toastFn=(msg,type='success')=>setToast({msg,type});
  const openWa=(client,payment=null)=>setWaModal({client,payment});
  useEffect(()=>{window.__handleUnauth=()=>{setAuthState('login');setUsername('');};},[]);
  useEffect(()=>{api('/auth/me').then(r=>{setUsername(r.username);setAuthState('app');}).catch(()=>setAuthState('login'));},[]);
  const logout=async()=>{await api('/auth/logout',{method:'POST'}).catch(()=>{});setAuthState('login');setUsername('');};

  if(authState==='loading')return<div className="loading-page"><span className="spinner spinner-dark" style={{width:28,height:28}}/><span>Yükleniyor...</span></div>;
  if(authState==='login')return <LoginPage onLogin={u=>{setUsername(u);setAuthState('app');}}/>;

  const nav=[
    {id:'dashboard',label:'Dashboard',icon:'dashboard'},
    {id:'clients',label:'Müşteriler',icon:'clients'},
    {id:'payments',label:'Müşteri Ödemeleri',icon:'payments'},
    {id:'personal',label:'Kişisel Finans',icon:'personal'},
    {id:'calendar',label:'Takvim',icon:'calendar'},
    {id:'tahakkuk',label:'Tahakkuk Fişi',icon:'payments'},
    {id:'tax-calendar',label:'Vergi Takvimi',icon:'calendar'},
    {id:'reminders',label:'Hatırlatma Ayarları',icon:'templates'},
    {id:'templates',label:'WA Taslakları',icon:'templates'},
    {id:'wa-incoming',label:'Gelen Faturalar',icon:'logs'},
    {id:'logs',label:'WA Geçmişi',icon:'logs'},
    {id:'settings',label:'Ayarlar',icon:'settings'},
  ];
  const titles={dashboard:'Dashboard',clients:'Müşteriler',payments:'Müşteri Ödemeleri',personal:'Kişisel Finans',calendar:'Takvim',tahakkuk:'Tahakkuk Fişi','tax-calendar':'Vergi Takvimi',reminders:'Hatırlatma Ayarları',templates:'WhatsApp Taslakları','wa-incoming':'Gelen Faturalar (WA)',logs:'WhatsApp Geçmişi',settings:'Ayarlar'};

  return(
    <div className="app-shell">
      <aside className="sidebar">
        <div className="sidebar-header">
          <div className="sidebar-logo">Mali Müşavir</div>
          <div className="sidebar-sub">Asistan Paneli v6 ✓</div>
        </div>
        <nav className="sidebar-nav">
          <div className="nav-section">Ana Menü</div>
          {['dashboard','clients','payments','personal','calendar'].map(id=>{
            const n=nav.find(x=>x.id===id);
            return <button key={id} className={`nav-item ${page===id?'active':''}`} onClick={()=>setPage(id)}><Ico n={n.icon} s={15}/> {n.label}</button>;
          })}
          <button className={`nav-item ${page==='tahakkuk'?'active':''}`} onClick={()=>setPage('tahakkuk')} style={{color:page==='tahakkuk'?'#fff':'rgba(255,255,255,.7)',background:page==='tahakkuk'?'rgba(255,255,255,.13)':'transparent'}}><span style={{fontSize:15}}>📄</span> Tahakkuk Fişi</button>
          <div className="nav-section" style={{marginTop:8}}>Otomasyon</div>
          <button className={`nav-item ${page==='tax-calendar'?'active':''}`} onClick={()=>setPage('tax-calendar')}><span style={{fontSize:15}}>🗓️</span> Vergi Takvimi</button>
          <button className={`nav-item ${page==='reminders'?'active':''}`} onClick={()=>setPage('reminders')}><span style={{fontSize:15}}>🔔</span> Hatırlatma Ayarları</button>
          <div className="nav-section" style={{marginTop:8}}>WhatsApp</div>
          {['templates','wa-incoming','logs'].map(id=>{
            const n=nav.find(x=>x.id===id);
            return <button key={id} className={`nav-item ${page===id?'active':''}`} onClick={()=>setPage(id)}><Ico n={n.icon} s={15}/> {n.label}{id==='wa-incoming'&&<span style={{marginLeft:'auto',background:'#C46A00',color:'#fff',borderRadius:10,fontSize:9,padding:'1px 5px',fontWeight:700}}>NEW</span>}</button>;
          })}
          <div className="nav-section" style={{marginTop:8}}>Hesap</div>
          <button className={`nav-item ${page==='settings'?'active':''}`} onClick={()=>setPage('settings')}><Ico n="settings" s={15}/> Ayarlar</button>
        </nav>
        <div className="sidebar-footer">
          <div className="user-info"><div className="user-dot"/>{username}</div>
          <button className="nav-item" onClick={logout} style={{color:'rgba(255,255,255,.45)',fontSize:12}}><Ico n="logout" s={14}/> Çıkış Yap</button>
        </div>
      </aside>
      <main className="main">
        <div className="topbar">
          <span className="topbar-title">{titles[page]}</span>
          <div className="topbar-right">
            <button className="btn btn-ghost btn-sm" onClick={()=>setPage('payments')} title="Bugünkü ödemelere git" style={{gap:6}}>
              📅 Bugün
            </button>
            <button className="btn btn-wa btn-sm" onClick={()=>setWaModal({client:null,payment:null})} style={{gap:7}}>{WA_SVG} Hızlı WhatsApp</button>
          </div>
        </div>
        <div className="content">
          {page==='dashboard'&&<Dashboard onNavigate={setPage}/>}
          {page==='clients'  &&<Clients onSendWa={openWa} toastFn={toastFn}/>}
          {page==='payments' &&<Payments onSendWa={openWa} toastFn={toastFn}/>}
          {page==='personal' &&<PersonalFinance toastFn={toastFn}/>}
          {page==='calendar' &&<CalendarView onSendWa={openWa} toastFn={toastFn}/>}
          {page==='tahakkuk'&&<TahakkukFisi toastFn={toastFn}/>}
          {page==='tax-calendar'&&<TaxCalendar toastFn={toastFn}/>}
          {page==='reminders'&&<ReminderSettings toastFn={toastFn}/>}
          {page==='templates'&&<Templates toastFn={toastFn}/>}
          {page==='wa-incoming'&&<WaIncoming toastFn={toastFn}/>}
          {page==='logs'     &&<WhatsappLogs/>}
          {page==='settings' &&<Settings username={username} toastFn={toastFn}/>}
        </div>
      </main>
      {waModal&&<WhatsappModal client={waModal.client} payment={waModal.payment} onClose={()=>setWaModal(null)} toastFn={toastFn}/>}
      <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast({msg:''})}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
